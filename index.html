      return Object.fromEntries(UNITS.map((u, i) => [u.id, ratingOf(demWins[i] / FORECAST.sims)]));
    });
  const houseModel = () => Promise.all([loadResults(2024), houseUnits()]).then(([r24, d26]) => {
    const units = PREDICTIONS[HOUSE_FORECAST].units;
    const n24 = nationalMargin(r24);
    const projected = units.map(u => HOUSE_MODEL.environment + twoParty(...d26.votes[u.id]) - n24);
    const normal = normalFrom(mulberry32(HOUSE_FORECAST));
    const demWins = new Float64Array(units.length);
    for (let s = 0; s < HOUSE_MODEL.sims; s++) {
      const nationalErr = normal() * HOUSE_MODEL.nationalSd;
      projected.forEach((m, i) => { if (m + nationalErr + normal() * HOUSE_MODEL.districtSd > 0) demWins[i]++; });
    }
    return Object.fromEntries(units.map((u, i) => [u.id, ratingOf(demWins[i] / HOUSE_MODEL.sims)]));
  });
  const senateModel = () => loadResults(2024).then(r24 => {
    const units = PREDICTIONS[SENATE_FORECAST].units;
    const n24 = nationalMargin(r24);
    const projected = units.map(u => HOUSE_MODEL.environment + twoParty(r24.states[u.state].dem, r24.states[u.state].rep) - n24);
    const normal = normalFrom(mulberry32(HOUSE_FORECAST + 1));
    const demWins = new Float64Array(units.length);
    for (let s = 0; s < HOUSE_MODEL.sims; s++) {
      const nationalErr = normal() * HOUSE_MODEL.nationalSd;
      projected.forEach((m, i) => { if (m + nationalErr + normal() * SENATE_MODEL.stateSd > 0) demWins[i]++; });
    }
    return Object.fromEntries(units.map((u, i) => [u.id, ratingOf(demWins[i] / HOUSE_MODEL.sims)]));
  });
  // 2024's presidential margins, statewide or by district (for the House, on the 2026 lines)
  const loadResultRatings = year => year === SENATE_FORECAST
    ? loadResults(2024).then(r24 => Object.fromEntries(PREDICTIONS[SENATE_FORECAST].units.map(u =>
      [u.id, marginRating(twoParty(r24.states[u.state].dem, r24.states[u.state].rep))])))
    : year === HOUSE_FORECAST
    ? houseUnits().then(d26 => Object.fromEntries(PREDICTIONS[HOUSE_FORECAST].units.map(u => [u.id, marginRating(twoParty(...d26.votes[u.id]))])))
    : Promise.all([loadResults(2024), loadDistricts(2024)]).then(([r24, d24]) =>
      Object.fromEntries(UNITS.map(u => {
        const v = u.district ? d24.votes[u.id] : [r24.states[u.state].dem, r24.states[u.state].rep];
        return [u.id, marginRating(twoParty(v[0], v[1]))];
      })));

  let onPrediction = () => {};
  const setRatings = (year, next) => {
    const P = PREDICTIONS[year];
    P.ratings = Object.fromEntries(Object.entries(next).filter(([, r]) => r !== TOSSUP));
    try { localStorage.setItem(P.storage, JSON.stringify(P.ratings)); } catch {}
    // Once edited, a reload keeps the edits rather than the shared link's map
    if (P.hash.test(location.hash)) history.replaceState(null, "", location.pathname + location.search);
    onPrediction();
  };

  // Detailed outlines: full-resolution Census TIGER counties clipped to the coastline, with states
  // dissolved from them so the borders line up (built by work/build_shapes.mjs). They're ~1.7 MB
  // gzipped, so the map first paints with us-atlas's coarse 1:10m states and swaps these in once
  // they arrive.
  const detailShapes = d3.json("shapes-albers.json").then(t => ({
    counties: topojson.feature(t, t.objects.counties).features,
    states: topojson.feature(t, t.objects.states).features
  }));
  const loadCountyShapes = () => detailShapes.then(s => s.counties);

  // Two-party margin in points; shade deepens with margin, saturating at MAX_MARGIN
  const MAX_MARGIN = 40;
  const FADE_MS = 250;
  // Counties shade by the winner's share of the major-candidate vote, from 50% (or less, with a
  // third ticket) to SHARE_MAX%+
  const SHARE_MAX = 90;
  const countyShare = (v, results) => {
    const r = voteObj(v, results), { winner, total } = rank(r);
    return { p: winner, pct: r[winner] / total * 100 };
  };
  const shareFill = ({ p, pct }) => shade[p](Math.max(0, Math.min(pct - 50, SHARE_MAX - 50)) / (SHARE_MAX - 50));
  const shade = {
    dem: d3.interpolateRgb("#dce6f7", "#0b3d91"),
    rep: d3.interpolateRgb("#f7dcde", "#9e0f1c")
  };

  d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-albers-10m.json").then(us => {
    const countyLayer = g.append("g").attr("class", "counties");
    const districtLayer = g.append("g").attr("class", "districts");
    const districtShapes = districtLayer.append("g");
    const districtBorders = districtLayer.append("path").attr("class", "district-states");
    const stateFeatures = topojson.feature(us, us.objects.states).features;
    const stateById = new Map(stateFeatures.map(d => [d.id, d]));
    const stateByName = new Map(stateFeatures.map(d => [d.properties.name, d]));
    // A county's state: historical outlines name it (a county can change states: Greer, Texas, became
    // Greer, Oklahoma), today's carry it in the FIPS code
    const countyState = d => d.properties.key ? stateByName.get(d.properties.state) : stateById.get(d.id.slice(0, 2));
    const states = g.append("g").attr("class", "states").selectAll("path")
      .data(stateFeatures)
      .join("path")
      .attr("class", "state")
      .attr("d", path)
      // On the 2028 prediction a click paints the state instead of zooming to it (the House
      // prediction paints districts, drawn over the states)
      .on("click", (e, d) => election === FORECAST_YEAR ? paintUnit(d.properties.name, e)
        : election !== HOUSE_FORECAST ? zoomToState(e, d)
        : chamber === "senate" && SENATE_RACES[d.properties.name] ? paintUnit(d.properties.name, e) : null);
    states.append("title");
    // Swap in detailed state outlines in place, so selection and lookups keep the same objects
    detailShapes.then(({ states: detailed }) => {
      for (const f of detailed) {
        const s = stateById.get(f.id);
        if (s) s.geometry = f.geometry;
      }
      states.attr("d", path);
    }).catch(err => console.error("Could not load detailed outlines", err));

    let current = null;  // { year, results, counties, districts } on screen
    let counties = null; // county paths, once loaded
    // Which outlines the county paths are: "modern", or "h<election day>" for historical ones, which
    // are redrawn for each election whose county lines differ
    let countySet = null, countySetLoading = null;
    const wantedCountySet = () => current?.counties?.outlinesDate ? `h${current.counties.outlinesDate}` : "modern";
    function drawCounties() {
      const want = wantedCountySet();
      if (countySet === want || countySetLoading === want) return;
      countySetLoading = want;
      const day = current.counties.outlinesDate;
      (day ? loadHistoricalCounties().then(h => h.features.filter(f => f.properties.start <= day && f.properties.end >= day))
        : loadCountyShapes()).then(features => {
        if (countySetLoading !== want) return;
        countySetLoading = null;
        countyLayer.selectAll("path").remove();
        counties = countyLayer.selectAll("path")
          .data(features)
          .join("path")
          .attr("class", "county")
          .attr("d", path)
          .on("click", (e, d) => zoomToCounty(e, d, countyState(d)));
        counties.append("title");
        if (!day) for (const f of features) countyName.set(f.id, f.properties.name);
        countySet = want;
        renderCounties();
        markSelected();
        updateDetail();
      }).catch(err => {
        countySetLoading = null;
        console.error("Could not load county outlines", err);
      });
    }

    const countyName = new Map(); // fips → name, for counties that were part of another
    // The historical atlas also outlines places no one voted in: lakes drawn as parishes, which are
    // left unfilled, and unorganized land, reservations and national parks, which take the no-result gray
    const WATER = /^Lake /;
    const UNPOPULATED = /Unorganized|Reserve|\bNp\b|Terr\.|Land Dist\.|Couba Island/;
    const water = d => !!d.properties.key && !d.properties.fips && WATER.test(d.properties.name);
    const unpopulated = d => !!d.properties.key && UNPOPULATED.test(d.properties.name);
    // Other counties without results (Alaska, and gaps in the historical returns) take their state's color
    function renderCounties() {
      if (!counties || !current?.counties || countySet !== wantedCountySet()) return;
      const { results, counties: votes } = current;
      counties
        .style("fill", d => {
          const v = votes[countyKey(d)];
          if (v) return shareFill(countyShare(v, results));
          if (water(d)) return "none";
          return unpopulated(d) ? null : stateFill(results, countyState(d)?.properties.name);
        })
        .select("title")
        .text(d => {
          const v = votes[countyKey(d)];
          const label = `${d.properties.name}, ${countyState(d)?.properties.name}`;
          if (!v && water(d)) return label;
          if (!v && unpopulated(d)) return `${label}: no votes cast`;
          if (!v) return `${label}: no county results`;
          const { p, pct } = countyShare(v, results);
          const r = voteObj(v, results);
          return `${label}: ${results.candidates[p]} ${pct.toFixed(1)}%`
            + (v.partOf ? ` (part of ${countyName.get(v.partOf)} in ${current.year})` : "")
            + "\n" + rank(r).order.map(q => `${results.candidates[q]} ${fmtVotes(r[q])}`).join(" · ");
        });
    }

    // Districts shade by vote share like counties; DC's delegate seat has no result and takes DC's color.
    // On the House prediction they shade by the viewer's rating, and a click paints one.
    function renderDistricts() {
      const data = current?.districts;
      const stateName = d => stateById.get(d.id.slice(0, 2))?.properties.name;
      const forecast = current?.results.forecast?.race === "house" ? current.results.forecast : null;
      districtBorders.datum(data?.stateBorders ?? null).attr("d", d => d && districtPath(d));
      const paths = districtShapes.selectAll("path")
        .data(data ? data.features.filter(d => !forecast || forecast.byId.has(d.id)) : [], d => d.id)
        .join(enter => enter.append("path").attr("class", "district").call(p => p.append("title")))
        .attr("d", districtPath)
        .on("click", (e, d) => houseForecastOn() ? paintUnit(d.id, e) : zoomToDistrict(e, d, stateById.get(d.id.slice(0, 2))));
      if (forecast) {
        paths.style("fill", d => ratingColor(forecast.byId.get(d.id).rating))
          .select("title").text(d => {
            const u = forecast.byId.get(d.id), [name, party] = data.incumbents[d.id] ?? [];
            const m = twoParty(...data.votes[d.id]);
            return `${u.label}: ${RATINGS[u.rating]}`
              + (name ? `\nIncumbent: ${name} (${partyAbbr(party, current.results)})` : "")
              + `\n2024: ${m > 0 ? "Harris" : "Trump"} +${Math.abs(m).toFixed(1)}\nClick to change`;
          });
        return markSelected();
      }
      paths
        .style("fill", d => {
          const v = data.votes[d.id], lone = data.unopposed[d.id];
          return v ? shareFill(countyShare(v, current.results)) : lone ? shade[lone](1) : stateFill(current.results, stateName(d));
        });
      paths.select("title").text(d => {
        const v = data.votes[d.id], lone = data.unopposed[d.id];
        const label = districtLabel(d.id, stateName(d));
        const names = withNames(current.results, data.names[d.id]);
        const note = data.notes[d.id] ? `\n${data.notes[d.id]}` : "";
        if (lone && !v) return `${label}: ${names[lone]} (${partyAbbr(lone, current.results)}), unopposed${note}`;
        if (!v) return `${label}: no district results`;
        const { p, pct } = countyShare(v, current.results);
        const r = voteObj(v, current.results);
        return `${label}: ${names[p]}${data.names[d.id] ? ` (${partyAbbr(p, current.results)})` : ""} ${pct.toFixed(1)}%`
          + (data.percentOnly.has(d.id) ? "" : "\n" + rank(r).order.map(q => `${names[q]} ${fmtVotes(r[q])}`).join(" · ")) + note;
      });
      markSelected();
    }

    // Toggle county or district detail for the detail setting, zoom, and election, loading
    // shapes on first use
    function updateDetail() {
      // The House prediction and midterm House results are drawn by district whatever the detail
      // setting; midterm Senate results only by state
      const houseForecast = current?.results.forecast?.race === "house";
      const midterm = chamberOf(current?.year);
      const districtMode = midterm ? midterm === "house" : detailMode === "district" || houseForecast;
      const districtYear = DISTRICT_YEARS.includes(current?.year) || houseForecast;
      g.classed("district-detail", districtMode && districtYear && !!current.districts);
      if (!districtMode && selected?.district) clearSelection();
      if (districtMode && districtYear && !current.districts) {
        const year = current.year;
        loadDistricts(year).then(data => {
          if (current?.year !== year || current.districts || !data) return;
          current.districts = data;
          renderDistricts();
          updateDetail();
        });
      }

      const zoomedIn = !houseForecast && !midterm && (detailMode === "county" || (detailMode === "auto" && zoomK >= COUNTY_ZOOM));
      const available = COUNTY_YEARS.includes(current?.year);
      const countiesReady = !!counties && !!current.counties && countySet === wantedCountySet();
      const detail = zoomedIn && available && countiesReady;
      const districtDetail = districtMode && districtYear && !!current.districts;
      g.classed("detail", detail);
      const forecasting = isForecast(current?.year);
      d3.select(".legend .measure").text(detail ? "County vote share"
        : districtDetail ? (midterm ? "House vote share" : "District vote share") : forecasting ? "Projected margin"
        : midterm ? "Senate margin" : "Margin of victory");
      d3.select(".legend .ticks").selectAll("span")
        .data(detail || districtDetail ? ["50%", "60", "70", "80", `${SHARE_MAX}+`] : ["0", "10", "20", "30", `${MAX_MARGIN}+`])
        .join("span")
        .text(t => t);
      const districtYears = DISTRICT_YEARS.filter(y => raceOf(y) === raceOf(current?.year));
      const seatsWon = (label, n) => n ? `${label} seats won: ${seatText(n, current.results)}` : "";
      d3.select(".legend .note").text(forecasting
        ? (zoomedIn || districtMode ? "The prediction is state-level only" : "")
        : midterm === "senate" ? seatsWon("Senate", current.results.national)
        : districtMode
        ? (!districtYear ? `District results available for ${districtYears[0]}\u2013${districtYears.at(-1)}`
          : current.districts ? `District lines: ${current.districts.lines}`
            + (midterm ? `. ${seatsWon("House", current.districts.national)}` : "") : "Loading districts\u2026")
        : !zoomedIn ? ""
        : available ? (!countiesReady ? "Loading counties\u2026"
          : (thirdParties(current.results).length ? "Winner's share of the major-candidate vote" : "Winner's share of the two-party vote")
            // Before 1848 each state picked its own day to vote, in November or early December
            + (current.counties.outlinesDate ? `. County lines as of ${current.year < 1848 ? "November" : "Election Day"} ${current.year}` : "")
            + (current.counties.note ? `. ${current.counties.note}` : ""))
        : current?.year === 1812 ? "No county results for 1812"
        : `County results available for ${COUNTY_YEARS[0]}\u2013${COUNTY_YEARS.at(-1)}`);
      if (zoomedIn && available && current.counties) drawCounties();
    }
    onZoomLevel = updateDetail;
    onDetailMode = updateDetail;

    // Margin over the runner-up, in points of the major-candidate vote
    const marginOf = r => { const { winner, total, lead } = rank(r); return { p: winner, margin: lead / total * 100 }; };
    const marginFill = ({ p, margin }) => shade[p](Math.min(margin, MAX_MARGIN) / MAX_MARGIN);

    // Where the legislature chose the electors, or no count survives, there's no margin, so take
    // the middle shade.
    // States that didn't vote get no fill and show the default gray.
    const LEGISLATURE_SHADE = 0.5;
    function stateFill(results, name) {
      const s = stateStatus(results, name);
      return s.r ? marginFill(marginOf(s.r))
        : s.legislature ? shade[s.legislature](LEGISLATURE_SHADE) : null;
    }

    function stateTitle(results, name) {
      const s = stateStatus(results, name);
      const where = s.partOf ? `${name} (part of ${s.partOf})` : name;
      if (s.r) {
        const { p, margin } = marginOf(s.r);
        // Senate races name their candidates
        const names = withNames(results, results.names?.[name]);
        if (results.unopposed?.[name]) return `${where}: ${names[p]} (${partyAbbr(p, results)}), unopposed`;
        const sp = results.specials?.[name];
        return `${where}: ${names[p]}${results.names?.[name] ? ` (${partyAbbr(p, results)})` : ""} +${margin.toFixed(1)}`
          + (sp ? `\n${specialText(sp, results)}` : "");
      }
      if (s.legislature) return `${where}: ${results.candidates[s.legislature]} (${s.byVoters
        ? "chosen by voters; no complete statewide count survives" : "electors chosen by the legislature"})`;
      return `${name}: ${absentText(s.absent)}`;
    }

    // Rating colors: safe the deepest shade, lean the lightest, toss-ups gray
    const RATING_DEPTH = [1, 0.55, 0.2];
    const depth = i => RATING_DEPTH[i < TOSSUP ? i : 6 - i];
    const ratingColor = i => i === TOSSUP ? "#d4d4d4" : shade[ratingSide(i)](depth(i));
    const ratingInk = i => i === TOSSUP || depth(i) < 0.5 ? "#111" : "#fff";

    // Senate seats not up in 2026: states striped in the holding party's color (both colors where the
    // seats are split), so they read as settled rather than rated. Patterns for the map, gradients for the card.
    const HELD_INK = { dem: shade.dem(0.55), rep: shade.rep(0.55) };
    const heldPattern = held => [...held].every(c => c === "R") ? "rep" : [...held].includes("R") ? "split" : "dem";
    // Each pattern's stripes, 2 units wide, with white between them
    const heldStripes = { dem: [HELD_INK.dem], rep: [HELD_INK.rep], split: [HELD_INK.dem, HELD_INK.rep] };
    const defs = svg.append("defs");
    for (const [k, inks] of Object.entries(heldStripes)) {
      const w = 4 * inks.length;
      const pat = defs.append("pattern").attr("id", `held-${k}`).attr("patternUnits", "userSpaceOnUse")
        .attr("width", w).attr("height", w).attr("patternTransform", "rotate(45)");
      pat.append("rect").attr("width", w).attr("height", w).attr("fill", "#fff");
      inks.forEach((ink, i) => pat.append("rect").attr("x", 4 * i).attr("width", 2).attr("height", w).attr("fill", ink));
    }
    const heldGradient = side => `repeating-linear-gradient(45deg, ${HELD_INK[side]} 0 2px, #fff 2px 4px)`;
    // Card rows: the seven ratings, then (for the Senate) the seats not up
    const HELD_ROWS = ["held-dem", "held-rep"];
    const rowSide = k => k === "held-dem" ? "dem" : "rep";

    // Painting: a chosen rating, or "cycle" to step each click along CYCLE (shift-click steps back)
    let brush = "cycle";
    function paintUnit(id, event) {
      const key = predictionKey(election), { ratings } = PREDICTIONS[key];
      const cur = ratings[id] ?? TOSSUP;
      const next = brush !== "cycle" ? brush
        : CYCLE[(CYCLE.indexOf(cur) + (event?.shiftKey ? -1 : 1) + CYCLE.length) % CYCLE.length];
      setRatings(key, { ...ratings, [id]: next });
    }

    const forecastCard = d3.select(".forecast");
    const renderBrushes = () => {
      const what = houseForecastOn() ? ["a district", "districts"] : ["a state", "states"];
      forecastCard.selectAll(".brushes button").attr("aria-pressed", i => brush === i)
        .attr("title", i => `Paint ${what[1]} ${RATINGS[i]}`);
      forecastCard.select(".cycle").attr("aria-pressed", brush === "cycle");
    };
    forecastCard.select(".brushes").selectAll("button")
      .data([...RATINGS.keys()])
      .join("button")
      .attr("type", "button")
      .text(i => i === TOSSUP ? "Toss\nup" : RATINGS[i].replace(" ", "\n"))
      .style("background", ratingColor)
      .style("color", ratingInk)
      .on("click", (e, i) => { brush = brush === i ? "cycle" : i; renderBrushes(); });
    forecastCard.select(".cycle").on("click", () => { brush = "cycle"; renderBrushes(); });
    renderBrushes();

    forecastCard.selectAll(".presets button[data-preset]").on("click", function () {
      const which = this.dataset.preset, year = predictionKey(election);
      if (which === "blank") return setRatings(year, {});
      this.disabled = true;
      (which === "model" ? loadModelRatings(year) : loadResultRatings(year))
        .then(r => setRatings(year, r), err => console.error(`Could not load the ${which} ratings`, err))
        .finally(() => { this.disabled = false; });
    });
    forecastCard.select(".share").on("click", function () {
      const P = PREDICTIONS[predictionKey(election)];
      const url = `${location.origin}${location.pathname}${location.search}#${P.hashKey}=${encodeRatings(P)}`;
      const show = text => { this.textContent = text; setTimeout(() => { this.textContent = "Copy link"; }, 1500); };
      if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => show("Copied"), () => show("Couldn't copy"));
      else show("Couldn't copy");
    });

    function renderForecastCard(f) {
      const house = f.race === "house", senate = f.race === "senate", plural = f.race !== "president";
      const byRating = d3.rollup(f.units, us => ({ ev: d3.sum(us, u => u.ev), labels: us.map(u => u.label) }), u => u.rating);
      const { dem, rep, tossup, toWin, unit, needs } = f;
      const units = n => `${n} ${unit[n === 1 ? 0 : 1]}`;
      // Rows and bar segments: held Democratic seats, the ratings, held Republican seats
      const seats = k => HELD_ROWS.includes(k) ? f.held?.[rowSide(k)] ?? 0 : byRating.get(k)?.ev ?? 0;
      const fill = k => HELD_ROWS.includes(k) ? heldGradient(rowSide(k)) : ratingColor(k);
      const label = k => HELD_ROWS.includes(k) ? `Not up (${rowSide(k) === "dem" ? "D" : "R"})` : RATINGS[k];
      const keys = senate ? [HELD_ROWS[0], ...RATINGS.keys(), HELD_ROWS[1]] : [...RATINGS.keys()];
      forecastCard.select(".side-dem").text(plural ? "Democrats" : "Democrat");
      forecastCard.select(".side-rep").text(plural ? "Republicans" : "Republican");
      forecastCard.select(".ev-dem").text(dem);
      forecastCard.select(".ev-rep").text(rep);
      forecastCard.select(".tossup-ev").text(tossup);
      forecastCard.select(".evbar .mark").style("left", `${toWin / f.total * 100}%`)
        .attr("title", needs.dem === needs.rep ? `${toWin} to win` : `Control: Democrats need ${needs.dem}, Republicans ${needs.rep} (the Vice President breaks ties)`);
      forecastCard.select(".split-units").attr("hidden", plural ? true : null);
      forecastCard.select('[data-preset="results"]').text(plural ? "2024 president" : "2024 results")
        .attr("title", `2024's presidential margins${house ? " on the 2026 lines" : senate ? " by state" : ""}: 10+ points safe, 5 to 10 likely, under 5 lean`);
      forecastCard.select('[data-preset="model"]').attr("title", house
        ? `Each district's 2024 presidential lean plus a D+${HOUSE_MODEL.environment} national environment (mid-October 2026 generic ballot), simulated and rated by each side's chance to win`
        : senate ? `Each state's 2024 presidential lean plus a D+${HOUSE_MODEL.environment} national environment (mid-October 2026 generic ballot), simulated and rated by each side's chance to win; no incumbency effects`
        : "Simulated from 2020 and 2024 results, rated by each side's chance to win");
      renderBrushes();

      // Electoral votes (or seats) by rating, Democrats from the left
      forecastCard.select(".evbar").selectAll("div")
        .data(keys.filter(seats), k => k)
        .join("div")
        .order()
        .style("flex", k => `${seats(k)} 0 0`)
        .style("background", fill)
        .attr("title", k => `${label(k)}: ${plural ? units(seats(k)) : `${seats(k)} electoral votes`}`);

      forecastCard.select(".units").selectAll("button")
        .data(plural ? [] : f.units.filter(u => u.district), u => u.id)
        .join(enter => enter.append("button").attr("type", "button").on("click", (e, u) => paintUnit(u.id, e)))
        .text(u => u.label)
        .style("background", u => ratingColor(u.rating))
        .style("color", u => ratingInk(u.rating))
        .attr("title", u => `${u.label}: ${RATINGS[u.rating]}. Click to change`);

      forecastCard.select(".counts tbody").selectAll("tr")
        .data(keys, k => k)
        .join(enter => {
          const tr = enter.append("tr");
          tr.append("td").call(td => { td.append("span").attr("class", "swatch"); td.append("span").attr("class", "label"); });
          tr.append("td").attr("class", "n").style("color", "#888");
          tr.append("td").attr("class", "ev");
          return tr;
        })
        .order()
        .attr("title", k => HELD_ROWS.includes(k) ? "Seats with no election in 2026" : byRating.get(k)?.labels.join(", ") ?? "")
        .call(tr => {
          tr.select(".swatch").style("background", fill);
          tr.select(".label").text(label);
          // A House or Senate race is one seat, so only the seats are worth a column
          tr.select(".n").text(k => { const n = byRating.get(k)?.labels.length ?? 0; return plural || !n ? "" : `${n} race${n === 1 ? "" : "s"}`; });
          tr.select(".ev").text(k => units(seats(k)));
        });
    }

    // Redraw on each new rating, at most once a frame
    let predictionFrame = 0;
    onPrediction = () => {
      cancelAnimationFrame(predictionFrame);
      predictionFrame = requestAnimationFrame(() => {
        const year = election;
        if (!isForecast(year)) return;
        Promise.all([loadPrediction(year), loadDistricts(year)]).then(([results, districts]) => {
          if (election === year) render(year, results, null, districts);
        });
      });
    };

    function render(year, results, countyVotes, districts) {
      current = { year, results, counties: countyVotes, districts };
      renderCounties();
      renderDistricts();
      updateDetail();
      const party = name => {
        const s = stateStatus(results, name);
        return s.r ? rank(s.r).winner : s.legislature ?? "";
      };
      states
        .attr("class", d => "state " + (party(d.properties.name) || "novote"))
        .style("fill", d => stateFill(results, d.properties.name))
        .select("title")
        .text(d => stateTitle(results, d.properties.name));
      const forecast = results.forecast;
      d3.select(".forecast").attr("hidden", forecast ? null : true);
      // The card carries the prediction's scale, so the margin legend steps aside
      d3.select(".legend").style("display", forecast ? "none" : null);
      if (forecast?.race === "president") {
        states
          .style("fill", d => ratingColor(forecast.states[d.properties.name].rating))
          .select("title")
          .text(d => {
            const u = forecast.states[d.properties.name];
            return `${d.properties.name} (${u.ev}): ${RATINGS[u.rating]}`
              + (SPLIT_STATES[d.properties.name] ? " statewide; rate its districts in the card" : "") + "\nClick to change";
          });
      }
      if (forecast?.race === "senate") {
        states
          .style("fill", d => {
            const u = forecast.byId.get(d.properties.name), held = SENATE_HELD[d.properties.name];
            return u ? ratingColor(u.rating) : held ? `url(#held-${heldPattern(held)})` : null;
          })
          .select("title")
          .text(d => {
            const name = d.properties.name, u = forecast.byId.get(name), held = SENATE_HELD[name];
            const heldText = held ? [...held].join(", ") : "";
            if (!u) return held ? `${name}: no Senate race in 2026 (seats held: ${heldText})` : `${name}: no Senate seats`;
            const [who, party, special] = SENATE_RACES[name];
            return `${name}${special ? " (special election)" : ""}: ${RATINGS[u.rating]}\nSeat held by ${who} (${partyAbbr(party, results)})`
              + `\nOther seat, not up: ${heldText}\nClick to change`;
          });
      }
      if (forecast) renderForecastCard(forecast);

      d3.select(".legend .year").text(year);
      updatePanel();
      // Legend: a row per party that carried a state, with a continuous gradient matching the fill
      // scale, and a gray row when some states didn't vote
      const winners = new Set(stateFeatures.map(d => party(d.properties.name)));
      // Midterm House maps are all districts, so the Senate's no-race gray never shows
      const anyAbsent = winners.has("") && chamberOf(year) !== "house";
      d3.select(".legend .rows").selectAll(".row")
        .data([...["dem", "rep", ...thirdParties(results)].filter(p => shade[p] && p in results.candidates && (p === "dem" || p === "rep" || winners.has(p))),
          ...(anyAbsent ? ["absent"] : [])])
        .join(enter => enter.append("div").attr("class", "row")
          .call(row => { row.append("span"); row.append("div").attr("class", "bar"); }))
        .classed("absent", p => p === "absent")
        .call(row => row.select("span").text(p => p === "absent" ? (results.race === "senate" ? "No race" : "No vote") : results.candidates[p]))
        .call(row => row.select(".bar").style("background", p => p === "absent" ? null
          : `linear-gradient(to right, ${shade[p](0)}, ${shade[p](1)})`));
    }

    // Fade out, swap in the new year's results once both the fade and the fetch are done, fade in.
    // A newer selection supersedes any in-flight one.
    let pending = 0;
    onElectionChange = year => {
      if (isForecast(year) && selected) clearSelection();
      const token = ++pending;
      g.classed("fading", true);
      Promise.all([loadResults(year), loadCounties(year),
        detailMode === "district" || (year === HOUSE_FORECAST && chamber === "house") || chamberOf(year) === "house" ? loadDistricts(year) : null, new Promise(r => setTimeout(r, FADE_MS))])
        .then(([results, countyVotes, districts]) => {
          if (token !== pending) return;
          render(year, results, countyVotes, districts);
          g.classed("fading", false);
        })
        .catch(err => {
          if (token !== pending) return;
          console.error(`Could not load results for ${year}`, err);
          g.classed("fading", false);
        });
    };

    Promise.all([loadResults(election), loadCounties(election),
      detailMode === "district" || houseForecastOn() || chamberOf(election) === "house" ? loadDistricts(election) : null]).then(([results, countyVotes, districts]) => {
      render(election, results, countyVotes, districts);
      d3.select(".legend").attr("hidden", null);
    });
  });
</script>
</body>
</html>
